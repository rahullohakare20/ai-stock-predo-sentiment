version: '3.9'

services:
  api:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - .:/app
      - ./model_cache:/app/model_cache
    env_file:
      - .env
    restart: unless-stopped

  dashboard:
    build: .
    command: python -m streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - '8501:8501'
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    restart: unless-stopped
